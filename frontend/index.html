<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Economic Passport - Login</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="login-container">

        <section class="login-card">

            <!-- BRAND -->
            <div class="brand">

                <div class="brand-icon">
                    EP
                </div>

                <h1>
                    Economic Passport
                </h1>

                <p>
                    Business Intelligence for Better Decisions
                </p>

            </div>


            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="login_email"
                    placeholder="Masukkan email"
                    autocomplete="off"
                    readonly
                >

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="login_password"
                        placeholder="Masukkan password"
                        autocomplete="new-password"
                        readonly
                    >

                    <button
    type="button"
    id="togglePassword"
    class="toggle-password"
    aria-label="Tampilkan password"
>
    <svg
        id="eyeOffIcon"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <path d="M3 3l18 18"></path>
        <path d="M10.58 10.58a2 2 0 0 0 2.83 2.83"></path>
        <path d="M9.88 4.24A9.77 9.77 0 0 1 12 4c5 0 8.5 5 8.5 5a13.16 13.16 0 0 1-2.11 2.73"></path>
        <path d="M6.61 6.61C4.62 7.84 3.5 9 3.5 9S7 14 12 14c1.1 0 2.13-.2 3.06-.53"></path>
    </svg>

    <svg
        id="eyeIcon"
        xmlns="http://www.w3.org/2000/svg"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        style="display: none;"
    >
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path>
        <circle cx="12" cy="12" r="3"></circle>
    </svg>
</button>

                </div>

            </div>


            <!-- LOGIN -->
            <button
                type="button"
                id="loginButton"
                class="login-button"
            >
                Login
            </button>


            <!-- ERROR -->
            <p
                id="errorMessage"
                class="error-message"
            ></p>


            <!-- REGISTER -->
            <div class="register-link">
                <span>
                    Belum punya akun?
                </span>
                <a href="register.html">
                    Daftar sekarang
                </a>
            </div>

        </section>

    </main>


    <script src="app.js"></script>


    <!-- PASSWORD TOGGLE -->
    <script>

        const password =
            document.getElementById("password");

        const togglePassword =
            document.getElementById("togglePassword");


        /* ==========================
           IZINKAN INPUT SAAT DIKLIK
           ========================== */

        document
            .getElementById("email")
            .addEventListener(
                "focus",
                function () {

                    this.removeAttribute(
                        "readonly"
                    );

                }
            );


        password.addEventListener(
            "focus",
            function () {

                this.removeAttribute(
                    "readonly"
                );

            }
        );


        /* ==========================
           BUKA / TUTUP PASSWORD
           ========================== */

        togglePassword.addEventListener(
            "click",
            function () {

                if (
                    password.type === "password"
                ) {

                    password.type =
                        "text";

                    togglePassword.textContent =
                        "🙈";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Sembunyikan password"
                    );

                } else {

                    password.type =
                        "password";

                    togglePassword.textContent =
                        "👁";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Tampilkan password"
                    );

                }

            }
        );

    </script>

</body>

</html>
